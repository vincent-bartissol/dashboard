name: Lighthouse production

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit production URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouse/lighthouserc.production.cjs
          uploadArtifacts: true
