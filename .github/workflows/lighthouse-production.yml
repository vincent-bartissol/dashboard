name: Lighthouse production

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit production URLs
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouse/lighthouserc.production.cjs
          uploadArtifacts: true
      - name: Summarize Lighthouse scores
        if: always()
        run: node lighthouse/summarize-scores.mjs
