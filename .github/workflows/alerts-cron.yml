name: Alerts cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Vélib alert rules
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://dashboard.vvbb.fr
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set" >&2
            exit 1
          fi
          curl -sfS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 60 \
            "${APP_URL}/api/cron/alerts"
